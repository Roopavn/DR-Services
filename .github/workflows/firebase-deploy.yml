name: Deploy DR Services Firebase backend

on:
  push:
    branches: [main]
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1072480737640/locations/global/workloadIdentityPools/github-dr-services/providers/github-dr-services-provider
          service_account: dr-services-deployer-copy@doorstep-services-c5d78.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.1

      - name: Verify Google Cloud credentials
        run: |
          firebase --version
          gcloud auth print-access-token > /dev/null
          echo "Google Cloud ADC token obtained successfully."

      - name: Deploy Firestore rules and indexes only
        env:
          FIREBASE_PROJECT_ID: doorstep-services-c5d78
        run: |
          firebase deploy --debug --project "$FIREBASE_PROJECT_ID" --only firestore:rules,firestore:indexes --non-interactive
